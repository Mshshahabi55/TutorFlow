# Dev/CI-only devcontainer (docs/decisions/PENDING-OWNER-DECISIONS.md
# Section 5, resolved 2026-07-29: dev/CI Docker is approved; production
# containerization is deferred, and the ADR-018 Iran-reachability
# constraint applies only to a real production deployment, not to this
# tooling — never used to deploy or host TutorFlow itself). Version-
# corrected to postgres:17 (docs/adr/ADR-013-persistence-technology.md's
# addendum) — was previously pinned to 14.3. The natively-installed
# PostgreSQL 17 setup in README.md's "Database setup" section remains the
# always-supported fallback if this Docker setup is unavailable or
# unreachable in a given environment.
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db
    
    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      
    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  postgres-data:

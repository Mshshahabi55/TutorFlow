# UNUSED SCAFFOLDING — not the supported dev setup path.
# This is GitHub's unmodified `dotnet-postgres` devcontainer template,
# added by the initial commit and never adapted to this project: it pins
# postgres:14.3 and a .NET 8.0 base image, while this project actually
# targets PostgreSQL 17 (docs/adr/ADR-013-persistence-technology.md's
# addendum) and .NET 9 (backend/global.json). It also pulls from Docker
# Hub, which docs/adr/ADR-018-regional-deployment-and-market-scope.md
# flags as a service that may be unreachable from Iran. The supported
# local setup is a natively-installed PostgreSQL 17 instance — see
# README.md's "Database setup" section. Left in place, not deleted, in
# case a future phase decides to invest in a real devcontainer; do not
# assume this file works or is maintained until that happens.
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db
    
    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:14.3
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      
    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  postgres-data:

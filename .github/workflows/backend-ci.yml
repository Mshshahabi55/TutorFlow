# Per docs/adr/ADR-018-regional-deployment-and-market-scope.md, this project
# cannot depend on GitHub being reachable — this workflow is best-effort CI
# convenience only. scripts/verify.ps1 is the authoritative "is the build
# green" gate; run it locally if this workflow is unavailable or untrusted.
name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore TutorFlow.sln

      - name: Build
        working-directory: backend
        run: dotnet build TutorFlow.sln --no-restore --configuration Release

      # Run twice: a determinism guard (docs/phases/PHASE-01-REPORT.md) — a
      # suite that only passes once is not proven green.
      - name: Test (run 1 of 2)
        working-directory: backend
        run: dotnet test TutorFlow.sln --no-build --configuration Release

      - name: Test (run 2 of 2)
        working-directory: backend
        run: dotnet test TutorFlow.sln --no-build --configuration Release

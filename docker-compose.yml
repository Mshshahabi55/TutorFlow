# Development-only PostgreSQL for TutorFlow. Not used by automated tests — those use
# Testcontainers (ephemeral, per-test-run containers), per CLAUDE.md's testing convention. This
# gives a persistent local database for day-to-day `dotnet run`/manual testing, and for running
# `dotnet ef database update` against something other than an ephemeral container.
#
# All credentials are supplied via environment variables (see .env.example) — nothing here is a
# real secret. The application never connects as the bootstrap admin role; a dedicated
# non-superuser `tutorflow_app` role (created by docker/postgres/init/01-create-app-role.sh) owns
# every TutorFlow database and is what every module's connection string authenticates as.
services:
  postgres:
    image: postgres:18
    container_name: tutorflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TUTORFLOW_DB_ADMIN_USER:-tutorflow_admin}
      POSTGRES_PASSWORD: ${TUTORFLOW_DB_ADMIN_PASSWORD:?Set TUTORFLOW_DB_ADMIN_PASSWORD in .env — see .env.example}
      POSTGRES_DB: postgres
      TUTORFLOW_APP_USER: ${TUTORFLOW_DB_APP_USER:-tutorflow_app}
      TUTORFLOW_APP_PASSWORD: ${TUTORFLOW_DB_APP_PASSWORD:?Set TUTORFLOW_DB_APP_PASSWORD in .env — see .env.example}
    ports:
      - "${TUTORFLOW_DB_PORT:-5432}:5432"
    volumes:
      # postgres:18+ images store data in a major-version-specific subdirectory under
      # /var/lib/postgresql itself (to support pg_ctlcluster-style upgrades) — mounting a
      # volume at the old /var/lib/postgresql/data path is rejected at startup on 18+.
      - tutorflow_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tutorflow_postgres_data:
    name: tutorflow_postgres_data
